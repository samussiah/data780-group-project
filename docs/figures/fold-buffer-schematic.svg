<text x="584" y="265" fill="#16232b" font-weight="600">spatial block</text>
<text x="584" y="283" fill="#55676f" font-size="12">no two basins more than 300 km apart</text>
<text x="562" y="320" fill="#55676f" font-size="12">In the next fold, other blocks are</text>
<text x="562" y="336" fill="#55676f" font-size="12">tested and the roles rotate.</text>
