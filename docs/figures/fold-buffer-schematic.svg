<text x="584" y="113" fill="#55676f" font-size="12">scored over the test years</text>
<circle cx="568" cy="136" r="6" fill="#ffffff" stroke="#8a99a0" stroke-width="2"/>
<text x="584" y="141" fill="#16232b" font-weight="600">buffer</text>
